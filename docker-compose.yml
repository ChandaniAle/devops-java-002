version: '3.8'

services:
  database-service:
    image: postgres:16-alpine
    container_name: postgres_database
    environment:
      POSTGRES_DB: ${DB_NAME:-studentdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password} 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-studentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  private-network:
    name: private-network
    driver: bridge

volumes:
  postgres_datas:
  